  <style>:root {
  --navy: #163c65; --ink: #172638; --line: #cdd3da;
  --rail: 34px; --grid-height: 858px; --day-header: 58px;
  font-family: 'Segoe UI', Arial, sans-serif;
  color: var(--ink); background: #f4f5f7; font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; }
button, input, select { font: inherit; }
button, summary { cursor: pointer; }
button { color: inherit; }
button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible, .calendar-scroll:focus-visible { outline: 3px solid #6c98c7; outline-offset: 3px; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.masthead { max-width: 1576px; margin: 0 auto; padding: 26px 32px 22px; display: grid; grid-template-columns: 106px 1fr auto; align-items: center; gap: 24px; }
.brand-logo { width: 94px; height: 77px; object-fit: contain; }
.week-title { margin: 0; text-align: center; font-size: clamp(17px, 1.55vw, 23px); line-height: 1.5; font-weight: 600; color: #152f4d; }
.header-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.heading-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 9px; width: 100%; }
.button { display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 11px 14px; border: 1px solid transparent; border-radius: 5px; min-height: 42px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.primary { color: #fff; background: var(--navy); }
.primary:hover { background: #254f7d; }
.secondary { background: #fff; border-color: #d2d8df; }
.secondary:hover { background: #edf1f6; }
.reset-button { color: #9a5a4d; border-color: #dfc9c2; margin-left: auto; }
.reset-button:hover { background: #fff4ef; }
.save-status { display: flex; align-items: center; gap: 6px; color: #7d8791; font-size: 10px; }
.save-status i { width: 5px; height: 5px; border-radius: 50%; background: #7e9e88; }
.save-status.error { color: #b14545; }
.save-status.error i { background: #b14545; }
.backup-menu { position: relative; }
.backup-menu summary { list-style: none; width: 30px; height: 36px; display: grid; place-items: center; border-radius: 4px; }
.backup-menu summary::-webkit-details-marker { display: none; }
.backup-menu summary:hover { background: #e8edf3; }
.dropdown { position: absolute; right: 0; top: 43px; padding: 6px; width: 235px; background: #fff; border: 1px solid #d2d8df; border-radius: 6px; box-shadow: 0 7px 25px #173a4020; z-index: 20; }
.dropdown button { display: block; text-align: left; width: 100%; background: none; border: 0; padding: 12px 10px; font-size: 12px; border-radius: 4px; }
.dropdown button:hover { background: #edf1f6; }
main { max-width: 1576px; margin: 0 auto; padding: 0 32px 28px; }
.planner { background: #fff; border: 1px solid var(--navy); }
.calendar-scroll { overflow-x: auto; }
.calendar { min-width: 760px; }
.days-row { display: grid; grid-template-columns: var(--rail) repeat(7, minmax(0, 1fr)); height: var(--day-header); background: var(--navy); }
.day-heading { display: flex; justify-content: center; align-items: center; gap: 7px; border-left: 1px solid #ffffff66; color: #fff; font-size: 15px; font-weight: 600; }
.day-number { font-size: inherit; }
.calendar-body { height: calc(var(--grid-height) * var(--layout-scale, 1)); position: relative; background: #fff; }
.period { position: absolute; left: 0; width: var(--rail); display: flex; align-items: center; justify-content: center; background: var(--navy); color: #fff; }
.period span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-weight: 600; letter-spacing: 2px; }
.morning { top: 0; height: 50%; }
.afternoon { top: 50%; bottom: 0; }
.days-grid { position: absolute; left: var(--rail); top: 0; bottom: 0; right: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.day-column { position: relative; background: #fff; border-left: 1px solid var(--line); cursor: crosshair; }
.day-column:first-child { border-left: 0; }
.fixed-bands { position: absolute; left: var(--rail); right: 0; top: 0; bottom: 0; pointer-events: none; z-index: 2; }
.fixed-band { position: absolute; left: 0; right: 0; height: calc(var(--grid-height) * 14 / 660); min-height: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; overflow: hidden; font-size: 10px; font-weight: 600; letter-spacing: .3px; }
.fixed-band time { font-size: inherit; font-weight: 500; }
.pink { background: #f2d8e3; color: #61404f; }
.blue { background: #d8eaf5; color: #34576b; }
.green { background: #dcecc9; color: #4e6439; }
.event { position: absolute; left: 5px; width: calc(100% - 10px); z-index: 3; text-align: center; border: 0; background: #fff; color: #000; border-radius: 0; padding: 4px; overflow: hidden; cursor: pointer; min-height: 0; }
.event:hover { outline: 1px dashed #a6afb9; outline-offset: -1px; }
.event:focus-visible { z-index: 5; }
.event-time { display: block; font-size: 11px; font-weight: 600; line-height: 1.2; }
.event-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; font-size: 13px; font-weight: 700; line-height: 1.25; margin-top: 3px; }
.event.short { padding: 0 3px; display: flex; align-items: center; justify-content: center; gap: 5px; }
.event.short .event-time { flex-shrink: 0; font-size: 9px; }
.event.short .event-title { display: block; margin: 0; white-space: nowrap; text-overflow: ellipsis; font-size: 10px; }
dialog { border: 1px solid #d2d8df; border-radius: 9px; padding: 0; color: var(--ink); width: min(490px, calc(100vw - 28px)); max-height: calc(100dvh - 32px); box-shadow: 0 25px 100px #173e4033; }
dialog::backdrop { background: #132a4266; backdrop-filter: blur(2px); }
#event-form { padding: 27px; }
.dialog-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 25px; }
h2 { font-size: 22px; letter-spacing: -.4px; font-weight: 600; line-height: 1.2; margin: 0; }
.close-button { font-size: 25px; background: #f0f2f6; line-height: 26px; border: 0; border-radius: 50%; width: 29px; height: 29px; color: #768598; }
.close-button:hover { background: #e0e6ef; }
.field { display: flex; flex-direction: column; gap: 8px; margin: 0 0 21px; font-size: 12px; font-weight: 600; }
.field input, .field select { width: 100%; min-width: 0; border: 1px solid #d2d8df; border-radius: 5px; padding: 11px 12px; background: #fff; font-size: 13px; min-height: 43px; color: #000; }
.field input::placeholder { color: #9aa3ae; font-weight: 400; }
.field input:focus, .field select:focus { border-color: #6687ad; }
.field-row { display: grid; grid-template-columns: 1.5fr 1fr; gap: 15px; }
#event-title { text-transform: uppercase; }
.recurring-option { display: flex; align-items: center; gap: 10px; font-size: 12px; padding: 3px 0; cursor: pointer; }
.recurring-option input { accent-color: var(--navy); width: 16px; height: 16px; margin: 0; }
.form-error { color: #b44f41; font-size: 12px; line-height: 1.5; margin: 14px 0 0; }
.form-error:empty { display: none; }
.dialog-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 25px; padding-top: 20px; border-top: 1px solid #e1e5eb; }
.dialog-actions-right { display: flex; gap: 9px; justify-content: flex-end; margin-left: auto; }
.delete-button { border: 0; background: none; color: #b45448; font-size: 12px; padding: 10px 0; }
.delete-button:hover { text-decoration: underline; }
.danger { background: #b45347; color: #fff; }
.danger:hover { background: #963e35; }
.confirm-content { padding: 27px; }
.confirm-content p { font-size: 13px; line-height: 1.7; color: #738195; margin: 17px 0 25px; }
.toast { position: fixed; bottom: 25px; left: 50%; transform: translate(-50%, 15px); background: var(--navy); color: #fff; padding: 13px 20px; border-radius: 6px; box-shadow: 0 4px 20px #173a4030; font-size: 12px; z-index: 100; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); text-align: center; }
.toast.visible { opacity: 1; transform: translate(-50%, 0); }
[hidden] { display: none !important; }
@media (max-width: 1100px) {
  .masthead { grid-template-columns: 85px 1fr; gap: 15px; padding: 22px 24px; }
  .brand-logo { width: 80px; height: 65px; }
  .header-controls { grid-column: 1 / -1; }
  .save-status { padding: 0; }
  .week-title { text-align: left; font-size: 20px; }
  main { padding: 0 24px 24px; }
}
@media (max-width: 650px) {
  :root { --rail: 30px; }
  .masthead { grid-template-columns: 64px 1fr; padding: 18px 14px; gap: 15px 12px; }
  .brand-logo { width: 62px; height: 51px; }
  .week-title { font-size: 16px; line-height: 1.5; }
  .header-controls { flex-direction: column; align-items: flex-end; gap: 9px; }
  .heading-actions { width: 100%; gap: 6px; }
  .heading-actions .button { flex: 1; padding: 10px 8px; font-size: 10px; }
  .heading-actions .reset-button { flex: 0 0 auto; }
  .heading-actions svg { width: 15px; height: 15px; }
  .save-status { padding-right: 0; font-size: 9px; }
  main { padding: 0 14px 20px; }
  .calendar { min-width: 1000px; }
  .day-heading { font-size: 13px; }
  .period span { font-size: 11px; }
  .fixed-band { justify-content: flex-start; padding-left: 13px; }
  #event-form { padding: 24px 20px; }
  h2 { font-size: 20px; }
  .field-row { gap: 10px; }
  .dialog-actions { gap: 6px; }
  .dialog-actions .button { padding: 10px; font-size: 11px; }
  .delete-button { font-size: 11px; }
}
@page { size: A3 landscape; margin: 0; }
@media print {
  :root { --rail: 7mm; --grid-height: 262.5mm; --day-header: 11mm; background: #fff; font-family: Arial, sans-serif; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  html, body { background: #fff; width: 420mm; height: 297mm; margin: 0; padding: 0; }
  .no-print, dialog, .toast { display: none !important; }
  .masthead { height: 23mm; margin: 0; padding: 0; gap: 6mm; grid-template-columns: 28mm 1fr 28mm; max-width: none; width: 100%; }
  .brand-logo { width: 28mm; height: 23mm; object-fit: contain; object-position: left top; }
  .week-title { text-align: center; font-size: 16pt; line-height: 1.3; color: #000; font-weight: 600; }
  main { padding: 0; margin: 0; max-width: none; width: 100%; }
  .planner { break-inside: avoid; border-width: .25mm; }
  .calendar-scroll { overflow: visible; }
  .calendar { min-width: 0; width: 100%; }
  .day-heading { font-size: 11pt; gap: 1.5mm; }
  .period span { font-size: 9pt; letter-spacing: 2pt; }
  .fixed-band { min-height: 0; font-size: 8pt; justify-content: center; padding: 0; gap: 2mm; }
  .event { padding: .8mm 1mm; color: #000; background: #fff; }
  .event-time { font-size: 8pt; }
  .event-title { font-size: 10pt; line-height: 1.15; margin-top: .7mm; }
  .event.short { padding: 0 .5mm; gap: 1mm; }
  .event.short .event-time { font-size: 7pt; }
  .event.short .event-title { font-size: 8pt; }
  .calendar-body { height: var(--grid-height); break-inside: avoid; }
}
</style>
  
</head>

<script>
const START = 8 * 60;
const END = 19 * 60;
const DAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const FIXED = [
  { time: '11:45', label: 'MISE EN TABLE', color: 'pink' },
  { time: '12:00', label: 'REPAS', color: 'blue' },
  { time: '16:00', label: 'GOÛTER', color: 'green' },
  { time: '18:15', label: 'MISE EN TABLE', color: 'pink' },
  { time: '18:30', label: 'REPAS', color: 'blue' },
];
function localDate(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
function parseDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) throw new Error('Date invalide.');
  const [y,m,d] = value.split('-').map(Number);
  const result = new Date(y,m-1,d,12);
  if (y < 1900 || y > 2199 || localDate(result) !== value) throw new Error('Date invalide.');
  return result;
}
function addDays(date, count) { const d = new Date(date); d.setDate(d.getDate()+count); return d; }
function mondayOf(date) { const d = new Date(date); d.setHours(12,0,0,0); return addDays(d,-((d.getDay()+6)%7)); }
function minutes(time) { const [h,m] = time.split(':').map(Number); return h*60+m; }
function timeAt(value) { return `${String(Math.floor(value/60)).padStart(2,'0')}:${String(value%60).padStart(2,'0')}`; }
function formatTime(time) { return time.replace(':','h'); }
function position(time) { return (minutes(time)-START)/(END-START)*100; }
function weekLabel(monday) {
  const sunday = addDays(monday,6);
  const month = new Intl.DateTimeFormat('fr-FR',{month:'long'});
  let first = String(monday.getDate());
  if (monday.getFullYear() !== sunday.getFullYear()) first += ` ${month.format(monday)} ${monday.getFullYear()}`;
  else if (monday.getMonth() !== sunday.getMonth()) first += ` ${month.format(monday)}`;
  return `Semaine du lundi ${first} au dimanche ${sunday.getDate()} ${month.format(sunday)} ${sunday.getFullYear()}`;
}
function occurrenceOn(event, date) {
  const value = localDate(date);
  return event.recurring ? value >= event.date && parseDate(event.date).getDay() === date.getDay() : event.date === value;
}
function resetWeekEvents(events, date) {
  const monday=mondayOf(date),start=localDate(monday),end=localDate(addDays(monday,7));
  return events.filter(event=>event.recurring || event.date<start || event.date>=end);
}
function normalizeEvent(input) {
  if (!input || typeof input !== 'object') throw new Error('Événement invalide.');
  const title = String(input.title || '').trim().toLocaleUpperCase('fr-FR');
  if (!title || title.length > 180) throw new Error('Indiquez un nom de 1 à 90 caractères.');
  parseDate(input.date);
  if (!/^\d{2}:\d{2}$/.test(input.time) || !/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(input.time)) throw new Error('Heure invalide.');
  if (minutes(input.time) < START || minutes(input.time) > END-15) throw new Error('Choisissez une heure entre 08h00 et 18h45.');
  if (typeof input.recurring !== 'boolean') throw new Error('Récurrence invalide.');
  // Legacy backups remain readable; the removed presentation fields are ignored.
  return { id: typeof input.id === 'string' && input.id.length <= 100 ? input.id : crypto.randomUUID(), title, date: input.date, time: input.time, recurring: input.recurring };
}
// Labels use the full day width. Additional space keeps stacked labels and
// the shared fixed bands apart without changing the events' actual times.
function layoutWeek(days) {
  const slots = new Map();
  function slot(time) {
    if (!slots.has(time)) slots.set(time,{ events: days.map(()=>[]), fixed: null });
    return slots.get(time);
  }
  days.forEach((events,day)=>events.forEach(event=>slot(minutes(event.time)).events[day].push(event)));
  FIXED.forEach(fixed=>{ slot(minutes(fixed.time)).fixed=fixed; });
  slot(13*60); slot(END);
  const result = days.map(()=>[]), cursors = days.map(()=>START), bands = [];
  const anchors = [{time:START,offset:0}];
  let shift=0, morningEnd=13*60-START, length=END-START;
  for (const [time,row] of [...slots].sort((a,b)=>a[0]-b[0])) {
    const barrier=!!row.fixed || time===13*60 || time===END;
    let start=barrier?Math.max(time+shift,...cursors):time+shift;
    if(row.fixed?.time==='12:00') {
      const setup=bands.find(band=>band.time==='11:45');
      start=Math.max(start,...result.flat().map(event=>START+event.layoutStart+event.displayMinutes+2+setup.displayMinutes));
      setup.layoutStart=start-START-setup.displayMinutes;
      anchors.find(anchor=>anchor.time===11*60+45).offset=setup.layoutStart;
    }
    if (barrier) {
      shift=start-time;
      anchors.push({time,offset:start-START});
    }
    if (time===13*60) morningEnd=start-START;
    if (row.fixed) {
      bands.push({...row.fixed,layoutStart:start-START,displayMinutes:row.fixed.time==='11:45'?15:14});
      cursors.fill(start+15);
    }
    row.events.forEach((events,day)=>events.forEach(event=>{
      const eventStart=Math.max(time+shift,cursors[day]);
      result[day].push({...event,layoutStart:eventStart-START,displayMinutes:43});
      cursors[day]=eventStart+45;
    }));
    if (time===END) length=start-START;
  }
  // Keep the evening setup and meal together at the bottom of the board.
  const eveningSetup=bands.find(band=>band.time==='18:15');
  const dinner=bands.find(band=>band.time==='18:30');
  eveningSetup.layoutStart=Math.max(
    length-eveningSetup.displayMinutes-dinner.displayMinutes,
    ...result.flat().map(event=>event.layoutStart+event.displayMinutes+2),
    ...bands.filter(band=>band!==eveningSetup && band!==dinner).map(band=>band.layoutStart+band.displayMinutes+1),
  );
  dinner.layoutStart=eveningSetup.layoutStart+eveningSetup.displayMinutes;
  length=dinner.layoutStart+dinner.displayMinutes;
  anchors.find(anchor=>anchor.time===END).offset=length;
  // Each period gets half the board. Expand the shorter period so stacked
  // labels retain their space, including when one period has more events.
  const half=Math.max(morningEnd,length-morningEnd);
  const morningScale=half/morningEnd,afternoonScale=half/(length-morningEnd);
  const balancedOffset=offset=>offset<=morningEnd
    ? offset*morningScale
    : half+(offset-morningEnd)*afternoonScale;
  function balanceItem(item) {
    const start=balancedOffset(item.layoutStart);
    return {...item,layoutStart:start,displayMinutes:balancedOffset(item.layoutStart+item.displayMinutes)-start};
  }
  return {
    days:result.map(events=>events.map(balanceItem)),
    fixed:bands.map(balanceItem),
    length:half*2,
    morningEnd:half,
    anchors:anchors.map(anchor=>({...anchor,offset:balancedOffset(anchor.offset)})),
  };
}
function clockAtOffset(layout,offset) {
  const anchors=layout.anchors;
  if(offset<=0)return START;
  for(let i=1;i<anchors.length;i++) {
    if(offset<=anchors[i].offset) {
      const previous=anchors[i-1],next=anchors[i];
      return previous.time+(next.time-previous.time)*(offset-previous.offset)/(next.offset-previous.offset);
    }
  }
  return END;
}


const $ = id => document.getElementById(id);
const KEY = 'denis-affre-planning-v1';
let events = [], week = mondayOf(new Date()), editing = null, occurrenceDate = null, pendingImport = null, toastTimer;
let todayKey = localDate(new Date());
let weekToReset=null;
const dialog = $('event-dialog');
function toast(message) { $('toast').textContent = message; $('toast').classList.add('visible'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),4000); }
function storageError(message) { $('save-status').classList.add('error'); $('save-status').replaceChildren(document.createElement('i'),document.createTextNode(message)); }
try {
  const saved = localStorage.getItem(KEY);
  if (saved) { const data=JSON.parse(saved); if(data.version!==1 || !Array.isArray(data.events)) throw new Error(); events=data.events.map(normalizeEvent); }
} catch { storageError('Sauvegarde à vérifier'); toast('La sauvegarde est illisible ou inaccessible. Exportez vos données avant de poursuivre.'); }
function persist(next) {
  try { localStorage.setItem(KEY,JSON.stringify({version:1,events:next})); events=next; $('save-status').classList.remove('error'); $('save-status').replaceChildren(document.createElement('i'),document.createTextNode('Enregistré sur cet appareil')); return true; }
  catch { storageError('Enregistrement impossible'); toast('Enregistrement impossible dans ce navigateur. Libérez de l’espace ou autorisez le stockage local.'); return false; }
}
function el(tag, className, text) { const n=document.createElement(tag); if(className)n.className=className; if(text!==undefined)n.textContent=text; return n; }
function render() {
  week=mondayOf(new Date());
  $('week-title').textContent=weekLabel(week);
  const corner=el('div','day-corner');corner.setAttribute('aria-hidden','true');
  $('days-row').replaceChildren(corner); $('days-grid').replaceChildren(); $('fixed-bands').replaceChildren();
  const dayEvents=DAYS.map((_,i)=>events.filter(event=>occurrenceOn(event,addDays(week,i))));
  const layout=layoutWeek(dayEvents);
  $('calendar-body').style.setProperty('--layout-scale',layout.length/(END-START));
  const afternoonStart=`${layout.morningEnd/layout.length*100}%`;
  document.querySelector('.morning').style.height=afternoonStart;
  document.querySelector('.afternoon').style.top=afternoonStart;
  for(let i=0;i<7;i++) {
    const date=addDays(week,i), key=localDate(date);
    const heading=el('div','day-heading'); heading.append(el('span','day-name',DAYS[i]),el('span','day-number',date.getDate()));if(key===localDate(new Date()))heading.setAttribute('aria-current','date');$('days-row').append(heading);
    const column=el('div','day-column');column.dataset.date=key; column.setAttribute('aria-label',`${DAYS[i]} ${date.getDate()}`);
    for(const event of layout.days[i]) {
      const button=el('button','event');button.type='button';button.dataset.eventId=event.id;button.style.top=`${event.layoutStart/layout.length*100}%`;button.style.height=`${event.displayMinutes/layout.length*100}%`;
      button.append(el('span','event-time',formatTime(event.time)),el('span','event-title',event.title));
      const description=`${event.title}, ${DAYS[i]} ${date.getDate()}, ${formatTime(event.time)}${event.recurring?', récurrent':''}. Modifier l’événement.`;
      button.title=description;button.setAttribute('aria-label',description);button.addEventListener('click',e=>{e.stopPropagation();openEvent(event,key);});column.append(button);
    }
    column.addEventListener('click',e=>{const bounds=column.getBoundingClientRect();const clock=clockAtOffset(layout,(e.clientY-bounds.top)/bounds.height*layout.length);const m=Math.min(END-15,Math.max(START,Math.round(clock/15)*15));openEvent(null,key,timeAt(m));});
    $('days-grid').append(column);
  }
  for(const fixed of layout.fixed){const band=el('div',`fixed-band ${fixed.color}`);band.dataset.time=fixed.time;band.style.top=`${fixed.layoutStart/layout.length*100}%`;band.style.height=`${fixed.displayMinutes/layout.length*100}%`;band.title='Rendez-vous quotidien fixe, non modifiable';band.append(el('span','',fixed.label),el('time','',formatTime(fixed.time)));$('fixed-bands').append(band);}
}
function openEvent(event=null,date=null,time='10:30') {
  editing=event?.id||null; occurrenceDate=event?date:null;
  $('event-form').reset();$('form-error').textContent='';
  const selected=date||localDate(new Date());
  $('event-date').replaceChildren(...DAYS.map((day,i)=>{const d=addDays(week,i),option=el('option','',`${day} ${d.getDate()}`);option.value=localDate(d);return option;}));
  $('event-title').value=event?.title||'';$('event-date').value=selected;$('event-time').value=event?.time||time;
  $('event-recurring').checked=event?.recurring||false;
  $('dialog-title').textContent=event?'Modifier l’événement':'Ajouter un événement';$('submit-event').textContent=event?'Enregistrer':'Ajouter au planning';$('delete-event').hidden=!event;
  dialog.showModal();
}
function closeEvent(){dialog.close();editing=null;occurrenceDate=null;}
$('event-form').addEventListener('submit',e=>{
  e.preventDefault();$('form-error').textContent='';
  try {
    const previous=events.find(e=>e.id===editing), selectedDate=$('event-date').value, recurring=$('event-recurring').checked;
    const currentWeek=mondayOf(new Date());
    if(selectedDate<localDate(currentWeek)||selectedDate>localDate(addDays(currentWeek,6)))throw new Error('Choisissez un jour de la semaine courante.');
    // Editing an unchanged recurring occurrence preserves its original starting date.
    let date=selectedDate;
    if(previous?.recurring&&recurring){const shift=Math.round((Date.UTC(...selectedDate.split('-').map((n,i)=>Number(n)-(i===1?1:0)))-Date.UTC(...occurrenceDate.split('-').map((n,i)=>Number(n)-(i===1?1:0))))/86400000);date=localDate(addDays(parseDate(previous.date),shift));}
    const event=normalizeEvent({id:editing||crypto.randomUUID(),title:$('event-title').value,date,time:$('event-time').value,recurring});
    const next=editing?events.map(e=>e.id===editing?event:e):[...events,event];
    if(!persist(next))return; const edited=!!editing;closeEvent();render();toast(edited?'Événement modifié.':'Événement ajouté au planning.');
  }catch(error){$('form-error').textContent=error.message;}
});
$('add-button').addEventListener('click',()=>openEvent());$('close-dialog').addEventListener('click',closeEvent);$('cancel-dialog').addEventListener('click',closeEvent);
dialog.addEventListener('cancel',()=>{editing=null;occurrenceDate=null;});
$('print-button').addEventListener('click',()=>window.print());
$('reset-week-button').addEventListener('click',()=>{weekToReset=new Date(week);$('reset-dialog').showModal();});
function closeReset(){ $('reset-dialog').close();weekToReset=null; }
$('cancel-reset').addEventListener('click',closeReset);
$('reset-dialog').addEventListener('cancel',()=>{weekToReset=null;});
$('confirm-reset').addEventListener('click',()=>{
  if(!weekToReset || !persist(resetWeekEvents(events,weekToReset)))return;
  closeReset();render();toast('Semaine réinitialisée. Les événements récurrents sont conservés.');
});
$('delete-event').addEventListener('click',()=>{const event=events.find(e=>e.id===editing);$('confirm-description').textContent=event.recurring?`« ${event.title} » sera supprimé de toutes les semaines. Les rendez-vous quotidiens fixes sont conservés.`:`« ${event.title} » sera supprimé du planning.`;$('confirm-dialog').showModal();});
$('cancel-delete').addEventListener('click',()=>$('confirm-dialog').close());$('confirm-delete').addEventListener('click',()=>{if(!persist(events.filter(e=>e.id!==editing)))return;$('confirm-dialog').close();closeEvent();render();toast('Événement supprimé.');});
$('export-button').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),events},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=`planning-denis-affre-${localDate(new Date())}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);$('backup-menu').open=false;toast('Sauvegarde exportée.');});
$('import-button').addEventListener('click',()=>{$('import-file').click();$('backup-menu').open=false;});
$('import-file').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  try{if(file.size>5000000)throw new Error('La sauvegarde est trop volumineuse (5 Mo maximum).');const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.events)||data.events.length>10000)throw new Error('Format de sauvegarde invalide.');const imported=data.events.map(normalizeEvent);if(new Set(imported.map(e=>e.id)).size!==imported.length)throw new Error('La sauvegarde contient des identifiants en double.');pendingImport=imported;$('import-description').textContent=`Cette sauvegarde contient ${imported.length} événement${imported.length>1?'s':''}. Elle remplacera vos ${events.length} événement${events.length>1?'s':''} actuels. Les horaires fixes seront conservés.`;$('import-dialog').showModal();}
  catch(error){toast(error instanceof SyntaxError?'Ce fichier JSON est illisible.':error.message);}
});
$('cancel-import').addEventListener('click',()=>{pendingImport=null;$('import-dialog').close();});$('confirm-import').addEventListener('click',()=>{if(pendingImport&&persist(pendingImport)){pendingImport=null;$('import-dialog').close();render();toast('Sauvegarde importée.');}});
window.addEventListener('storage',e=>{if(e.key===KEY){try{const data=e.newValue?JSON.parse(e.newValue):{version:1,events:[]};if(data.version!==1||!Array.isArray(data.events))throw new Error();events=data.events.map(normalizeEvent);render();toast('Planning mis à jour depuis un autre onglet.');}catch{storageError('Sauvegarde à vérifier');}}});
setInterval(()=>{const current=localDate(new Date());if(current!==todayKey){todayKey=current;render();}},30000);
render();

</script></body>
</html>
