  const iv = crypto.getRandomValues(new Uint8Array(12));

  return { version: 1, iterations: ITERATIONS, salt: toBase64(salt), iv: toBase64(iv), ciphertext: toBase64(new Uint8Array(ciphertext)) };
}
async function encryptText(text, material, purpose = APP_PURPOSE) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  return encryptWithKey(text, salt, await deriveKey(material, salt), purpose);
}
async function decryptText(envelope, material, purpose = APP_PURPOSE) {
  if (envelope.version !== 1 || envelope.iterations !== ITERATIONS) throw new Error('Format chiffré invalide.');
  const salt = fromBase64(envelope.salt), iv = fromBase64(envelope.iv);
  if (salt.length !== 16 || iv.length !== 12) throw new Error('Format chiffré invalide.');
  const key = await deriveKey(material, salt);
  const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: encoder.encode(purpose) }, key, fromBase64(envelope.ciphertext));
  return decoder.decode(plaintext);
}
function createVault(material) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  let keyPromise;
  return Object.freeze({
    async encode(data) {
      keyPromise ||= deriveKey(material, salt);
      return JSON.stringify(await encryptWithKey(JSON.stringify(data), salt, await keyPromise, DATA_PURPOSE));
    },
    async decode(raw) {
      return JSON.parse(await decryptText(JSON.parse(raw), material, DATA_PURPOSE));
    }
  });
}
