// Web Crypto only: the password and encryption keys are never persisted.
const ITERATIONS = 600000;
const encoder = new TextEncoder();
const decoder = new TextDecoder('utf-8', { fatal: true });
const APP_PURPOSE = 'denis-affre-app-v1';
const DATA_PURPOSE = 'denis-affre-events-v1';

function toBase64(bytes) {
  let binary = '';
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary);
}
function fromBase64(value) {
  return Uint8Array.from(atob(value), c => c.charCodeAt(0));
}
function importPassword(password) {
  return crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
}
async function deriveKey(material, salt) {
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptWithKey(text, salt, key, purpose) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: encoder.encode(purpose) }, key, encoder.encode(text));
  return { version: 1, iterations: ITERATIONS, salt: toBase64(salt), iv: toBase64(iv), ciphertext: toBase64(new Uint8Array(ciphertext)) };
}
async function encryptText(text, material, purpose = APP_PURPOSE) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  return encryptWithKey(text, salt, await deriveKey(material, salt), purpose);
}
async function decryptText(envelope, material, purpose = APP_PURPOSE) {
  if (envelope.version !== 1 || envelope.iterations !== ITERATIONS) throw new Error('Format chiffré invalide.');
  const salt = fromBase64(envelope.salt), iv = fromBase64(envelope.iv);
  if (salt.length !== 16 || iv.length !== 12) throw new Error('Format chiffré invalide.');
  const key = await deriveKey(material, salt);
  const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: encoder.encode(purpose) }, key, fromBase64(envelope.ciphertext));
  return decoder.decode(plaintext);
}
function createVault(material) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  let keyPromise;
  return Object.freeze({
    async encode(data) {
      keyPromise ||= deriveKey(material, salt);
      return JSON.stringify(await encryptWithKey(JSON.stringify(data), salt, await keyPromise, DATA_PURPOSE));
    },
    async decode(raw) {
      return JSON.parse(await decryptText(JSON.parse(raw), material, DATA_PURPOSE));
    }

// Shared Firebase storage. Authentication tokens live only in this tab's memory.
class PlanningConflictError extends Error {
  constructor() { super('Le planning a été modifié sur un autre ordinateur. Rechargez-le avant de réessayer.'); this.name = 'PlanningConflictError'; }
}

function mergeEventChanges(base, next, remote) {
  const before = new Map(base.map(event => [event.id, event]));
  const after = new Map(next.map(event => [event.id, event]));
  const result = new Map(remote.map(event => [event.id, event]));
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  for (const id of new Set([...before.keys(), ...after.keys()])) {
    const oldEvent = before.get(id), newEvent = after.get(id), current = result.get(id);
    if (same(oldEvent, newEvent)) continue;
    if (!same(current, oldEvent) && !same(current, newEvent)) throw new PlanningConflictError();
    if (newEvent) result.set(id, newEvent); else result.delete(id);
  }
  return [...result.values()];
}

async function connectPlanningCloud(config, password, vault, fetcher = fetch) {
  if (!config?.apiKey || !config?.databaseURL || !config?.uid || !config?.email) throw new Error('La sauvegarde en ligne n’est pas encore configurée.');
  let session, refreshPromise;
  async function authRequest(url, body, form = false) {
    let response;
    try { response = await fetcher(url, { method: 'POST', headers: { 'Content-Type': form ? 'application/x-www-form-urlencoded' : 'application/json' }, body: form ? new URLSearchParams(body).toString() : JSON.stringify(body), signal: AbortSignal.timeout(15000) }); }
    catch { throw new Error('Connexion au service en ligne impossible. Vérifiez votre connexion Internet.'); }
    if (!response.ok) {
      if (response.status === 400) throw new Error('Connexion refusée. Vérifiez le mot de passe du planning.');
      throw new Error('Le service de connexion est indisponible. Réessayez.');
    }

  function setSession(data, refreshed = false) {
    const uid = refreshed ? data.user_id : data.localId;
    if (uid !== config.uid) throw new Error('Ce compte n’a pas accès au planning.');
    session = { token: refreshed ? data.id_token : data.idToken, refresh: refreshed ? data.refresh_token : data.refreshToken, expires: Date.now() + Number(refreshed ? data.expires_in : data.expiresIn) * 1000 };

  password = '';
  async function idToken() {
    if (session.expires > Date.now() + 60000) return session.token;
    refreshPromise ||= authRequest(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(config.apiKey)}`, { grant_type: 'refresh_token', refresh_token: session.refresh }, true).then(data => setSession(data, true)).finally(() => { refreshPromise = null; });
    await refreshPromise;
    return session.token;
  }
  async function request(method = 'GET', data, etag) {
    const token = await idToken();
    const path = config.path || 'planning/amandiers';
    const url = `${config.databaseURL.replace(/\/$/, '')}/${path}.json?auth=${encodeURIComponent(token)}`;
    let response;
    try { response = await fetcher(url, { method, headers: { 'X-Firebase-ETag': 'true', ...(etag ? { 'if-match': etag } : {}), ...(data === undefined ? {} : { 'Content-Type': 'application/json' }) }, ...(data === undefined ? {} : { body: JSON.stringify(data) }), cache: 'no-store', signal: AbortSignal.timeout(15000) }); }
    catch { throw new Error('Connexion interrompue : les modifications n’ont pas été enregistrées. Réessayez.'); }

    if (!response.ok) throw new Error(response.status === 401 || response.status === 403 ? 'Accès au planning refusé. Reconnectez-vous.' : 'Sauvegarde en ligne indisponible. Réessayez.');

    const response = await request();
    if (!response.etag) throw new Error('La sauvegarde en ligne ne peut pas être vérifiée.');
    if (response.value === null) return { exists: false, events: [], etag: response.etag };
    if (response.value.schema !== 1 || typeof response.value.encrypted !== 'string') throw new Error('Le format du planning en ligne est invalide.');
    const data = await vault.decode(response.value.encrypted);
    if (data.version !== 1 || !Array.isArray(data.events) || data.events.length > 10000 || new Set(data.events.map(event => event?.id)).size !== data.events.length) throw new Error('Le planning en ligne est illisible.');

  }

    get initial() { return structuredClone(current); },
    async refresh() { current = await read(); return structuredClone(current); },

    }

  const error = document.getElementById('access-error');
  error.textContent = '';
  if (!crypto.subtle) { error.textContent = 'Ouvrez le planning avec une version récente de Chrome, Edge ou Firefox, à son adresse HTTPS.'; return; }
  button.disabled = true; button.textContent = 'Ouverture…';
  let material, content, cloudConfig, password = input.value;
  setPasswordVisible(false);
  try {
    material = await importPassword(password);
    input.value = '';
    const unlocked = JSON.parse(await decryptText(JSON.parse(document.getElementById('protected-payload').textContent), material));
    content = unlocked.html; cloudConfig = unlocked.cloudConfig;
  } catch {
    password = '';
    error.textContent = 'Mot de passe incorrect. Réessayez.';
    button.disabled = false; button.textContent = 'Ouvrir le planning'; input.focus(); return;
  }
  window.planningVault = createVault(material);
  if (cloudConfig) {
    try { window.planningCloud = await connectPlanningCloud(cloudConfig, password, window.planningVault); }
    catch (failure) {
      password = ''; error.textContent = failure.message;
      button.disabled = false; button.textContent = 'Ouvrir le planning'; input.focus(); return;
    }
  }
  password = '';
  document.open(); document.write(content); document.close();
});
})();
</script>
</body></html>
